# PDC on the infracriv platform: one container, its SQLite database on the volume matcher_data.
# Caddy reaches it as matcher:8000 over the shared "infracriv" network, behind Authelia.
# No "ports:": PDC trusts Authelia's headers and must only be reachable through Caddy.
name: matcher

services:
  matcher:
    image: ghcr.io/bvelsac/matcher:latest
    build: .
    restart: unless-stopped
    environment:
      TZ: Europe/Brussels
      APP_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      PDC_EDITORS: ${PDC_EDITORS:-}
    volumes:
      - matcher_data:/data
    networks: [infracriv]

networks:
  infracriv:
    external: true

volumes:
  matcher_data:
    name: matcher_data
