{% extends "pdc2/base.html" %}
{% block title %}{{ code }} - PDC2{% endblock %}
{% block body_class %}screen-error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-octagon error-icon"></i>
    <h1 class="mt-3">{{ message }}</h1>
    {% if code == 401 %}<p class="text-muted">PDC2 is reached through the login of the platform.</p>{% endif %}
</div>
{% endblock %}
