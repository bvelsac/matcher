{% extends "base.html" %}

{% block title %}Edit meeting - PDC{% endblock %}

{% block body_class %}screen-meeting-form{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-pencil"></i> Edit meeting</h1>
    <a href="{{ url_for('meeting_detail', id=meeting.id) }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back to meeting</a>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-calendar-event"></i> {{ meeting.display_title }}</h5></div>
            <div class="card-body">
                <form method="POST" id="meeting-form">
                    {% include "meetings/_fields.html" %}
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('meeting_detail', id=meeting.id) }}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
