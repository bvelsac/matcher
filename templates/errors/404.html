{% extends "base.html" %}

{% block title %}Page not found - PDC{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-triangle error-icon text-warning"></i>
    <h1 class="display-1 fw-bold text-primary">404</h1>
    <h2 class="mb-4">Page not found</h2>
    <p class="lead text-muted mb-4">The page you are looking for does not exist or has been removed.</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary"><i class="bi bi-house"></i> Dashboard</a>
        <button onclick="history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Go back</button>
    </div>
</div>
{% endblock %}
